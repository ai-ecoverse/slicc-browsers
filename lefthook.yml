extends:
  - node_modules/@ai-ecoverse/slicc-shared-web/lefthook.yml

pre-commit:
  jobs:
    - name: guard runner diff coverage
      glob: "{guard-runner.mjs,fixture-server.mjs}"
      run: npm run --silent test:unit:guard
    - name: corpus bundle
      glob: "corpus/**"
      run: node scripts/corpus.mjs --check
