name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: timeout -k 30 720 npm run test:guard

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LEFTHOOK: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          install-only: true

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --target wasm32-wasip1
          rustup default stable

      - run: npm ci

      - run: npm run lint

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      LEFTHOOK: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-wasip1
          rustup default stable

      - run: npm ci

      - name: Validate the catalog and the corpus
        run: npm run validate

      - name: Go
        run: |
          go build ./...
          go test -race -count=1 ./test/integration/...
          CGO_ENABLED=0 go build ./...

      - name: Rust
        run: |
          cargo test --all-features
          cargo build
          for features in "" serde corpus; do
            cargo build --target wasm32-wasip1 --no-default-features --features "$features"
          done

      - name: npm
        run: npm pack --dry-run --ignore-scripts
