name: Release

on:
  push:
    branches: [main, 1.13.x]
  workflow_dispatch:
    inputs:
      tag:
        description: Publish this existing vX.Y.Z tag to npm and crates.io, without a new release
        type: string
        default: ''
      cert-only:
        description: Skip the release and append the cert line for the latest npm version to its GitHub release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/1.13.x') && !inputs.cert-only
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LEFTHOOK: '0'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-wasip1
          rustup default stable

      - run: npm ci

      - run: npm test

      - run: cargo build --target wasm32-wasip1 --all-features

      - name: semantic-release
        if: inputs.tag == ''
        shell: bash
        run: |
          shim="$RUNNER_TEMP/git-retry"
          mkdir -p "$shim"
          ln -sf "$PWD/scripts/git-retry.mjs" "$shim/git"
          REAL_GIT="$(command -v git)" PATH="$shim:$PATH" npx semantic-release 2>&1 | tee "$RUNNER_TEMP/semantic-release.log"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          git fetch origin --tags --force
          if [ -n "$INPUT_TAG" ]; then
            if ! printf '%s\n' "$INPUT_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$' || ! git rev-parse -q --verify "refs/tags/$INPUT_TAG" >/dev/null; then
              echo "::error::$INPUT_TAG is not an existing vX.Y.Z tag"
              exit 1
            fi
            echo "version=${INPUT_TAG#v}" >> "$GITHUB_OUTPUT"
            echo "publish $INPUT_TAG"
            exit 0
          fi
          tag=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          if [ -z "$tag" ]; then
            echo "no release tag on HEAD"
            exit 0
          fi
          if [ ! -s "$RUNNER_TEMP/semantic-release.log" ]; then
            echo "::error::semantic-release left no log"
            exit 1
          fi
          if grep -qF "Created tag $tag" "$RUNNER_TEMP/semantic-release.log"; then
            node scripts/gate.mjs --expect "major-guard: PASS ${tag//./\\.} fits " --in "$RUNNER_TEMP/semantic-release.log"
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "release $tag"

      - name: Warm the Go module proxy and pkg.go.dev
        if: steps.version.outputs.version != '' && inputs.tag == ''
        continue-on-error: true
        timeout-minutes: 5
        working-directory: ${{ runner.temp }}
        env:
          MODULE: github.com/ai-ecoverse/slicc-browsers
          TAG: v${{ steps.version.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5; do
            if GOPROXY=https://proxy.golang.org GOFLAGS=-mod=mod go list -m "$MODULE@$TAG"; then
              break
            fi
            sleep $((attempt * 10))
          done
          curl -fsS -X POST --max-time 30 "https://pkg.go.dev/fetch/$MODULE@$TAG" || echo "::warning::pkg.go.dev did not accept a fetch of $MODULE@$TAG"

  npm:
    needs: release
    if: needs.release.outputs.version != '' && vars.SLICC_BROWSERS_NPM_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: scripts/dist-tag.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Dist-tag
        id: dist
        env:
          REF: ${{ github.ref }}
        run: |
          latest="$(npm view @ai-ecoverse/slicc-browsers dist-tags.latest 2>/dev/null || true)"
          tag="$(node scripts/dist-tag.mjs "$VERSION" "$REF" "$latest")"
          echo "publish $VERSION from $REF to $tag, latest is ${latest:-unset}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: v${{ needs.release.outputs.version }}

      - name: Publish to npm
        env:
          DIST_TAG: ${{ steps.dist.outputs.tag }}
        run: |
          name=$(node -p "require('./package.json').name")
          if npm view "$name@$VERSION" version >/dev/null 2>&1; then
            echo "$name@$VERSION is already on npm"
            exit 0
          fi
          if ! node -e "const [a,b,c]=process.argv[1].split('.').map(Number);process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)"; then
            npm install -g npm@11
          fi
          node scripts/set-crate-version.mjs "$VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version --ignore-scripts
          npm publish --provenance --access public --ignore-scripts --tag "$DIST_TAG"

  cert:
    needs: [release, npm]
    if: always() && (needs.npm.result == 'success' || inputs.cert-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Append the npm pack sha256 to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: '@ai-ecoverse/slicc-browsers'
          RELEASED: ${{ needs.release.outputs.version }}
        run: |
          version="${RELEASED:-$(npm view "$NAME" version)}"
          deadline=$(( $(date +%s) + 600 ))
          until head="$(npm view "${NAME}@${version}" gitHead 2>/dev/null)" && [ -n "$head" ]; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::${NAME}@${version} has no gitHead on the registry"
              exit 1
            fi
            sleep 10
          done
          dir="$(mktemp -d)"
          file="$(cd "$dir" && npm pack "${NAME}@${version}" --silent)"
          sha="$(sha256sum "${dir}/${file}" | cut -d' ' -f1)"
          line="cert: ${NAME}@${version} sha256=${sha} gitHead=${head}"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          tag="v${version}"
          body="$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json body -q .body)"
          if printf '%s\n' "$body" | grep -qxF "$line"; then
            echo "${tag} already carries the cert line"
            exit 0
          fi
          printf '%s\n\n%s\n' "$body" "$line" > "${dir}/notes.md"
          gh release edit "$tag" -R "$GITHUB_REPOSITORY" --notes-file "${dir}/notes.md"

  crates:
    needs: release
    if: needs.release.outputs.version != '' && vars.SLICC_BROWSERS_CRATES_PUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: v${{ needs.release.outputs.version }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Decide
        id: decide
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -A "slicc-browsers (https://github.com/ai-ecoverse/slicc-browsers)" "https://crates.io/api/v1/crates/slicc-browsers/$VERSION")
          if [ "$code" = "200" ]; then
            echo "slicc-browsers $VERSION is already on crates.io"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
        id: auth
        if: steps.decide.outputs.publish == 'true'

      - name: Publish to crates.io
        if: steps.decide.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          node scripts/set-crate-version.mjs "$VERSION"
          cargo publish --allow-dirty
