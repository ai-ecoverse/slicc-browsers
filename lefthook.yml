extends:
  - node_modules/@ai-ecoverse/slicc-shared-web/lefthook.yml

pre-commit:
  jobs:
    - name: guard runner diff coverage
      glob: "{guard-runner.mjs,fixture-server.mjs,fixture-client.mjs,observer-target.mjs,protected-error-page.mjs,unparseable-url.mjs}"
      run: npm run --silent test:unit:guard
    - name: redirect diff coverage
      glob: "{redirect-secret.mjs,redirect-fragments.mjs}"
      run: npm run --silent test:unit:redirect
    - name: corpus bundle
      glob: "corpus/**"
      run: node scripts/corpus.mjs --check
